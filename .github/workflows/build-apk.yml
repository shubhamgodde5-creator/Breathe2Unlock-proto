name: Build Breathe2Unlock APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK (manual)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH
          ls -la $ANDROID_SDK_ROOT

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install build tools and platform
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Verify gradle wrapper
        run: |
          ls -la gradle/wrapper/
          head -5 gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK (skip tests)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Breathe2Unlock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
